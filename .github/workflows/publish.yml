name: Publish

on:
  # v0.34.2 (P2-2 fix): tag push re-triggers this workflow so the
  # Create GitHub Release step (guarded by github.ref startsWith 'refs/tags/v')
  # can actually fire. workflow_dispatch covers the version-bump + publish path.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # v0.39.2: Trusted Publishing via OIDC. `id-token: write` is REQUIRED for
    # npm to mint a short-lived auth token from the GitHub Actions OIDC
    # provider at publish time. The trust is configured on npmjs.com
    # (Settings -> Trusted Publishers) against:
    #   Publisher:  GitHub Actions
    #   Owner:      herjarsa
    #   Repo:       omo-meta-governor
    #   Workflow:   publish.yml
    # With `--provenance`, npm publishes via OIDC with no long-lived token
    # (replaces the deprecated 2FA-bypass GAT pattern from npm v11.x and
    # earlier). No `secrets.NPM_TOKEN` is required anymore; if present it
    # is ignored in favor of the OIDC exchange.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # v0.39.2 fix: setup-node@v4 registers the registry in ~/.npmrc with
      # the right host config to perform the OIDC token exchange at publish
      # time. Without this, `npm publish --provenance` fails with
      # `ENEEDAUTH: need auth` because the bun-only runner doesn't expose
      # the ACTIONS_ID_TOKEN_REQUEST_TOKEN / ACTIONS_ID_TOKEN_REQUEST_URL
      # env vars in a form npm recognizes.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      # v0.39.2: was `bun test src/*.test.ts` which segfaults on
      # version-sync.test.ts under fresh-checkout conditions (see
      # commits cf87e70 + c48d95e — flaky test history). Running `bun test`
      # without the file filter matches what the CI workflow uses and
      # avoids the segfault. CI runs above already verified the suite
      # green for this commit; this is a redundant belt-and-suspenders
      # pre-publish check.
      - run: bun test
      - run: bun run build
      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com@users.noreply.github.com"
          # v0.39.2: `npm version patch` requires a clean working tree.
          # `bun run build` creates dist/ (gitignored, OK) but `bun test`
          # also leaves some test fixtures behind. Commit any non-build
          # artifacts first so npm version sees a clean tree.
          git add -A
          git diff --cached --quiet || git commit -m "ci: test+build artifacts for publish"
          npm version ${{ github.event.inputs.version }}
      - name: Publish
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm publish --access public --provenance
      - name: Push tags
        if: github.event_name == 'workflow_dispatch'
        run: git push --tags

      # v0.39.0 fix: idempotent. `bun run release` already creates the GitHub
      # Release via --notes-file in scripts/release.ts. Re-running `gh release
      # create` returns HTTP 422 (release exists). continue-on-error is the
      # canonical Actions way to express "release may already exist; either
      # way is fine" without depending on gh release view (which had auth
      # scope / propagation issues in the Actions runner context).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh release create "$GITHUB_REF_NAME" --repo herjarsa/omo-meta-governor \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for details."