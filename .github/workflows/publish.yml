name: Publish

on:
  # v0.34.2 (P2-2 fix): tag push re-triggers this workflow so the
  # Create GitHub Release step (guarded by github.ref startsWith 'refs/tags/v')
  # can actually fire. workflow_dispatch covers the version-bump + publish path.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun test src/*.test.ts
      - run: bun run build
      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          npm version ${{ github.event.inputs.version }}
      - name: Publish
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push tags
        if: github.event_name == 'workflow_dispatch'
        run: git push --tags

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo herjarsa/omo-meta-governor --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for details."